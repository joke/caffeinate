pluginManagement {  
    repositories {
        gradlePluginPortal()
    }
    plugins {
        id 'net.ltgt.errorprone' version '5.1.1'
        id 'net.ltgt.nullaway' version '3.3.0'
        id 'com.palantir.baseline' version '7.13.0'
        id 'com.diffplug.gradle.spotless' version '8.10.2'
    }
}

rootProject.name = 'caffeinate'

include 'annotations'
